# Baskit(Limenote SaaS) 배포용 Blueprint.
# 이름을 scm-inventory-*와 다르게 둔 이유: 같은 Render 워크스페이스에 기존 사내용 서비스가 있어도
# 이름이 겹쳐 그 서비스/DB에 연결되거나 설정이 덮어써지지 않도록, 완전히 별개의 리소스로 만든다.
databases:
  - name: baskit-db
    # 대시보드에서 유료(0.1 CPU · 256MB)로 올린 요금제와 맞춘다. 여기를 free로 두면 동기화가 다운그레이드를 시도하다 실패한다.
    # 요금제는 대시보드가 아니라 이 파일에서 바꾼다(대시보드에서만 바꾸면 다음 동기화 때 이 값과 어긋난다).
    plan: basic-256mb
    databaseName: baskit
    user: baskit

services:
  - type: web
    name: baskit-web
    runtime: node
    plan: free
    # main에는 아직 초기 커밋만 있어, 실제 앱 코드가 있는 브랜치를 명시한다.
    branch: claude/intelligent-mayer-ilfo5t
    # NODE_ENV=production이어도 Tailwind/PostCSS/TypeScript 등 빌드 도구가 필요하다.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # 이전 사내용 앱 데이터 이관: LEGACY_* 환경변수가 있을 때만 동작하고, 이미 옮겼으면 건너뛴다. 실패해도 앱은 뜬다.
    startCommand: npx prisma migrate deploy && (npm run db:import-legacy || true) && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baskit-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
      # 보관 기한 정리 API(/api/cron/maintenance) 호출용 비밀값 — 외부 스케줄러에 같은 값을 넣는다.
      - key: CRON_SECRET
        generateValue: true
      # 업로드 원본 파일을 둘 S3 호환 저장소(R2 등). 비워 두면 DB에 저장한다.
      - key: FILE_STORAGE_BUCKET
        sync: false
      - key: FILE_STORAGE_ENDPOINT
        sync: false
      - key: FILE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: FILE_STORAGE_SECRET_ACCESS_KEY
        sync: false
      # 가입 인증·비밀번호 재설정·팀 초대 메일(Resend). 없으면 메일이 나가지 않는다.
      - key: RESEND_API_KEY
        sync: false
      # 보내는 주소 — Resend에서 인증한 도메인이어야 한다. 예: Limenote <no-reply@limenote.cc>
      - key: MAIL_FROM
        sync: false
      # 메일 속 링크 주소
      - key: APP_URL
        value: https://limenote.cc
      # 이전 사내용 앱(scm-inventory) 데이터 이관용 — 이관이 끝나면 지워도 된다.
      - key: LEGACY_DATABASE_URL
        sync: false
      - key: LEGACY_IMPORT_TARGET_EMAIL
        sync: false
