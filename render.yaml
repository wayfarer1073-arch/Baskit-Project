# Baskit(Limenote SaaS) 배포용 Blueprint.
# 이름을 scm-inventory-*와 다르게 둔 이유: 같은 Render 워크스페이스에 기존 사내용 서비스가 있어도
# 이름이 겹쳐 그 서비스/DB에 연결되거나 설정이 덮어써지지 않도록, 완전히 별개의 리소스로 만든다.
databases:
  - name: baskit-db
    plan: free
    databaseName: baskit
    user: baskit

services:
  - type: web
    name: baskit-web
    runtime: node
    plan: free
    # main에는 아직 초기 커밋만 있어, 실제 앱 코드가 있는 브랜치를 명시한다.
    branch: claude/intelligent-mayer-ilfo5t
    # NODE_ENV=production이어도 Tailwind/PostCSS/TypeScript 등 빌드 도구가 필요하다.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baskit-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
